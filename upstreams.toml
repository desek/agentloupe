# @agents-index The allowlist of upstreams: each table names the base URL that the proxy forwards to and the LiteLLM provider of its prices.

[anthropic]
base_url = "https://api.anthropic.com"
litellm_provider = "anthropic"

[openai]
base_url = "https://api.openai.com"
litellm_provider = "openai"

# Calls through chatgpt get the API-equivalent cost of the OpenAI API.
[chatgpt]
base_url = "https://chatgpt.com"
litellm_provider = "openai"

# Pi providers. The names equal the provider field of the Pi log.
[github-copilot]
base_url = "https://api.githubcopilot.com"
litellm_provider = "github_copilot"

[groq]
base_url = "https://api.groq.com"
litellm_provider = "groq"

[cerebras]
base_url = "https://api.cerebras.ai"
litellm_provider = "cerebras"
