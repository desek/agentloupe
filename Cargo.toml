# @agents-index Cargo manifest of the agent-loupe crate, which builds the single loupe binary.
[package]
name = "agent-loupe"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "agent_loupe"
path = "src/lib.rs"

[[bin]]
name = "loupe"
path = "src/main.rs"

[[test]]
name = "serve_health"
path = "tests/serve.health.rs"

[[test]]
name = "serve_shutdown"
path = "tests/serve.shutdown.rs"

[[test]]
name = "serve_config"
