# @agents-index Cargo manifest of the agent-loupe crate, which builds the single loupe binary.
[package]
name = "agent-loupe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "loupe"
path = "src/main.rs"

[[test]]
name = "serve_health"
path = "tests/serve.health.rs"

[[test]]
name = "serve_shutdown"
path = "tests/serve.shutdown.rs"

[[test]]
name = "serve_config"
path = "tests/serve.config.rs"

[[test]]
name = "proxy_forward"
path = "tests/proxy.forward.rs"

[[test]]
name = "proxy_capture"
path = "tests/proxy.capture.rs"

[[test]]
name = "proxy_queue"
path = "tests/proxy.queue.rs"

[[test]]
name = "proxy_failure"
path = "tests/proxy.failure.rs"

[[test]]
name = "proxy_stream"
path = "tests/proxy.stream.rs"

[[test]]
name = "proxy_abort"
path = "tests/proxy.abort.rs"

[[test]]
name = "proxy_secrets"
path = "tests/proxy.secrets.rs"

[[test]]
name = "serve_router"
path = "tests/serve.router.rs"

[[test]]
name = "token_cli"
path = "tests/token.cli.rs"

[[test]]
name = "token_proxy"
path = "tests/token.proxy.rs"

[[test]]
name = "token_secrets"
path = "tests/token.secrets.rs"

[[test]]
name = "api_privacy"
path = "tests/api.privacy.rs"

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }

[dev-dependencies]
tempfile = "3"
