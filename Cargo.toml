# @agents-index Cargo manifest of the agent-loupe crate, which builds the single loupe binary.
[package]
name = "agent-loupe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = "build.rs"

[lib]
name = "agent_loupe"
path = "src/lib.rs"

[[bin]]
name = "loupe"
path = "src/main.rs"

