# The release build profile (docs/specification/release.md, section Release build profile): build hygiene
# that makes the binary smaller and casual reading harder; no secrecy claim. The dev and test profiles stay
# the Cargo defaults. panic = "abort" rests on the unwinding check of that section.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

