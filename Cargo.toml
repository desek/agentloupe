path = "tests/price.fixtures.rs"

[[test]]
name = "price_required"
path = "tests/price.required.rs"

[[test]]
name = "price_worker"
path = "tests/price.worker.rs"

[[test]]
name = "upstreams"
path = "tests/upstreams.rs"

[[test]]
