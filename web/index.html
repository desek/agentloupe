<!doctype html>
<!-- @agents-index The dashboard page shell: head, the product header with the wordmark, the range buttons, and the scheme switch, the main area, and the footer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site_title}}</title>
<link rel="icon" href="/favicon.ico">
<script src="/assets/js/scheme.boot.js"></script>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/page.css">
<link rel="stylesheet" href="/assets/css/live.css">
<script type="module" src="/assets/js/app.js"></script>
</head>
<body>
<div class="wrap">
<header class="header">
<div class="brand">
<svg class="logo" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
<circle cx="19" cy="19" r="12" fill="none" stroke="currentColor" stroke-width="2.5"/>
<line x1="28" y1="28" x2="38.5" y2="38.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
<rect x="12.5" y="19" width="3.5" height="6" rx="1" fill="var(--color-input)"/>
<rect x="17.25" y="13" width="3.5" height="12" rx="1" fill="var(--color-input)"/>
<rect x="22" y="16" width="3.5" height="9" rx="1" fill="var(--color-input)"/>
</svg>
<h1 class="wordmark">{{site_title}}</h1>
</div>
<div class="ranges" role="group" aria-label="Range" id="ranges">
<button type="button" class="pill" data-range="1M" aria-pressed="true">1M</button>
<button type="button" class="pill" data-range="3M" aria-pressed="false">3M</button>
<button type="button" class="pill" data-range="6M" aria-pressed="false">6M</button>
<button type="button" class="pill" data-range="1Y" aria-pressed="false">1Y</button>
</div>
<button type="button" class="switch" id="scheme-switch" role="switch" aria-checked="false" aria-label="Dark mode"><span class="switch-knob"><svg class="icon icon-sun" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><svg class="icon icon-moon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></svg></span></button>
</header>
<main id="main" aria-live="polite"></main>
<template id="price-note"><p class="footnote">* <a href="https://github.com/BerriAI/litellm" rel="noopener noreferrer">LiteLLM</a> list prices at <code>{{price_commit}}</code>, not money paid.</p></template>
<footer class="footer" id="footer"></footer>
</div>
</body>
</html>
