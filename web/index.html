<!doctype html>
<!-- @agents-index The dashboard page shell: head, header with the site title and the range buttons, the main area, and the footer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site_title}}</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/page.css">
<link rel="stylesheet" href="/assets/css/live.css">
<script type="module" src="/assets/js/app.js"></script>
</head>
<body>
<div class="wrap">
<header class="header">
<div class="header-text">
<h1 class="title">{{site_title}}</h1>
<p class="updated" id="updated">Loading</p>
</div>
<div class="ranges" role="group" aria-label="Range" id="ranges">
<button type="button" class="pill" data-range="3M" aria-pressed="true">3M</button>
<button type="button" class="pill" data-range="6M" aria-pressed="false">6M</button>
<button type="button" class="pill" data-range="1Y" aria-pressed="false">1Y</button>
</div>
</header>
<main id="main" aria-live="polite"></main>
<template id="cost-footnote"><p class="footnote">* Prices from LiteLLM, price file <code>model_prices_and_context_window.json</code> at commit <code>{{price_commit}}</code>. Source: <a href="https://github.com/BerriAI/litellm" rel="noopener noreferrer">github.com/BerriAI/litellm</a>.</p></template>
<footer class="footer" id="footer"></footer>
</div>
</body>
</html>
