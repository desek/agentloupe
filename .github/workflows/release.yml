# @agents-index Release workflow: on a tag v<major>.<minor>.<patch>, gates on visibility and the verdict, builds three binaries and two platform images, then publishes.
#
# A thin caller of the release scripts: release.build.sh builds the asset of the host target and
# release.image.sh builds, pushes, and merges the image; the scripts hold the image name, the targets,
# and the tag checks. docs/specification/release.md (Release flow) states the order.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to release again, for example the tag of a failed release.
        required: true
        type: string

permissions:
  contents: read

# A release run is never cancelled.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: never

jobs:
  # The first job, on Linux x86_64: a private repository stops the run before any macOS or arm64 job and
  # before any push to the registry, so a private run uses no paid runner.
  visibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop when the repository is private
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" != false ]; then
            echo "::error::the repository visibility is private, so the release stops before any build. Fix: make the repository public (gh repo edit --visibility public), then start this workflow again with the tag input. Reference: docs/specification/release.md, section Release flow."
            exit 1
          fi
          echo "repository visibility: public"

  verdict:
    needs: visibility
    uses: ./.github/workflows/verdict.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    needs: verdict
    strategy:
      fail-fast: true
      matrix:
        runner: [macos-15, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.runner }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: .agents/scripts/release.build.sh --tag "$TAG" --out "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.runner }}
          path: ${{ runner.temp }}/assets/
          retention-days: 3
          if-no-files-found: error

  image:
    needs: verdict
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: .agents/scripts/release.image.sh build --tag "$TAG" --digest-dir "$RUNNER_TEMP/digests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/
          retention-days: 3
          if-no-files-found: error

  # Runs only when the three builds and both image builds passed, so the release never gets a partial set
  # from this run and the tag latest moves only with both platforms.
  publish:
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - run: .agents/scripts/release.image.sh merge --tag "$TAG" --digest-dir "$RUNNER_TEMP/digests"
