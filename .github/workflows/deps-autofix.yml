# @agents-index Dependency autofix workflow: each day and on dispatch, one call of deps.autofix.sh fixes the Dependabot alerts and pull requests with headless Claude Code and merges the green fixes.
#
# A thin caller: it checks out the default branch with no credential in the git configuration, installs the
# Rust toolchain of rust-toolchain.toml and Node, cargo-nextest, cargo-deny, and Claude Code of .tool-versions,
# restores the cargo cache of the verdict test job, and makes one call of deps.autofix.sh, which holds every
# rule, limit, model, branch name, and label. Only the step of the script gets CLAUDE_CODE_OAUTH_TOKEN and the
# release token; the script gives no GitHub token to claude -p. It never starts on a push or a pull request, so
# its own merges do not start it again. docs/specification/dependencies.md states the rules.
name: deps-autofix

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, with no write (true or false)
        type: boolean
        default: false
      retry_failed:
        description: End the hold time of the failed items for this run (true or false)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: read
  actions: read
  checks: read

# One group for all runs; a new run waits and never cancels an active run.
concurrency:
  group: deps-autofix
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Install Node, cargo-nextest, cargo-deny, and Claude Code of .tool-versions
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: nodejs aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny npm:@anthropic-ai/claude-code
      - name: Make the Claude Code binary runnable
        run: .agents/scripts/claude.ensure.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Fix the Dependabot alerts and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}
          RETRY_FAILED: ${{ inputs.retry_failed == true && '--retry-failed' || '' }}
        run: .agents/scripts/deps.autofix.sh --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" $DRY_RUN $RETRY_FAILED
