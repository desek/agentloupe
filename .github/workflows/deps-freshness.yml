# @agents-index Dependency freshness workflow: each week and on dispatch, the job update calls deps.freshness.sh update and the job assess calls deps.freshness.sh assess; each uploads its report.
#
# A thin caller: each job checks out the default branch with no credential in the git configuration, installs
# the Rust toolchain of rust-toolchain.toml and Node, cargo-nextest, cargo-deny, and Claude Code of .tool-versions,
# makes the Claude Code binary runnable, restores the cargo cache of the verdict test job, makes one call of
# deps.freshness.sh, which holds every rule, threshold, limit, model, branch name, and label, and uploads the
# report as an artifact. Only the step of the script gets CLAUDE_CODE_OAUTH_TOKEN, and only the step of the job
# update gets the release token; the script gives no GitHub token to claude -p. It shares the concurrency group
# of the daily autofix, so the two never run at once. docs/specification/dependencies.md (Freshness workflow)
# states the rules.
name: deps-freshness

on:
  schedule:
    - cron: '43 7 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, with no claude -p run and no write (true or false)
        type: boolean
        default: false

permissions: {}

# The group of the daily autofix; a new run waits and never cancels an active run.
concurrency:
  group: deps-autofix
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      issues: write
      security-events: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Install Node, cargo-nextest, cargo-deny, and Claude Code of .tool-versions
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: nodejs aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny npm:@anthropic-ai/claude-code
      - name: Make the Claude Code binary runnable
        run: .agents/scripts/claude.ensure.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Run the freshness update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: .agents/scripts/deps.freshness.sh update --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --report "$RUNNER_TEMP/freshness-update.json" $DRY_RUN
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-freshness-update-report
          path: ${{ runner.temp }}/freshness-update.json
          retention-days: 30
          if-no-files-found: warn

  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Node and Claude Code of .tool-versions
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: nodejs npm:@anthropic-ai/claude-code
      - name: Make the Claude Code binary runnable
        run: .agents/scripts/claude.ensure.sh
      - name: Run the freshness assessment
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: .agents/scripts/deps.freshness.sh assess --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --report "$RUNNER_TEMP/freshness-assess.json" $DRY_RUN
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-freshness-assess-report
          path: ${{ runner.temp }}/freshness-assess.json
          retention-days: 30
          if-no-files-found: warn
