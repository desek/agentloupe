# @agents-index Wrangler configuration of the Worker agentloupe-telemetry: the workers.dev subdomain only, one D1 database, logs off.
#
# The Worker receives the start request of loupe serve (docs/specification/telemetry.md). It has no route and
# no custom domain, no Logpush, and no tail consumer. telemetry.deploy.sh writes database_id on the first run;
# the ID is not a secret.
name = "agentloupe-telemetry"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false
logpush = false
send_metrics = false

# Workers Logs would keep request data, headers included, on the account.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "agentloupe-telemetry"
database_id = "4d739d08-6823-4a7f-845f-8fef1b103130"
migrations_dir = "migrations"
