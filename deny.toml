# @agents-index Policy of the dependency check (cargo deny): allowed licenses, advisories, bans, and sources of Cargo.lock.
#
# .agents/scripts/deps.deny.sh runs the four checks against this file in the lint stage.
# docs/specification/operations.md (Dependency check) states the policy. The allow list of [licenses]
# must equal the accepted list of about.toml; deps.deny.sh fails when the two lists differ.

[graph]
# The three release targets, the same as about.toml, so both tools judge one dependency graph.
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
# A vulnerability fails for every crate (the default of cargo deny). An unmaintained or unsound
# advisory fails for a direct dependency only. A yanked crate fails.
# An ignore entry names the advisory, the reason, and a review date, for example:
# { id = "RUSTSEC-0000-0000", reason = "no patched version; the code path is unused; review 2027-01-31" },
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive SPDX identifiers only; no copyleft license is on the list. An exception for one crate
# names the crate and the reason in a comment.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []
# A license on the list that no crate uses is not an error.
unused-allowed-license = "allow"

[bans]
# A wildcard version requirement fails; more than one version of a crate only warns.
wildcards = "deny"
multiple-versions = "warn"

[sources]
# Only the crates.io registry; a git source or another registry fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
